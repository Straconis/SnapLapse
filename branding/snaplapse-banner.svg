<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx=".18" cy=".42" r=".55">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".35"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- Icon (design D) -->
  <g transform="translate(96 64) scale(.4297)">
    <rect width="512" height="512" rx="112" fill="url(#g)"/>
    <g fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M104 180 V124 a20 20 0 0 1 20-20 H180"/><path d="M332 104 H388 a20 20 0 0 1 20 20 V180"/>
      <path d="M408 332 V388 a20 20 0 0 1-20 20 H332"/><path d="M180 408 H124 a20 20 0 0 1-20-20 V332"/>
    </g>
    <path d="M256 256 L256 160 A96 96 0 0 1 339.14 304 Z" fill="#67E8F9"/>
    <circle cx="256" cy="256" r="96" fill="none" stroke="#fff" stroke-width="20"/>
    <line x1="256" y1="256" x2="256" y2="180" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="15" fill="#fff"/>
  </g>

  <!-- Wordmark and tagline -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#fff">
    <text x="340" y="160" font-size="96" letter-spacing="-2"><tspan font-weight="700">Snap</tspan><tspan font-weight="400">Lapse</tspan></text>
    <text x="344" y="214" font-size="30" fill="#CBD5E1">Timed screenshots of any window, even when it's covered.</text>
    <text x="344" y="262" font-size="18" font-weight="600" letter-spacing="3" fill="#67E8F9">WINDOWS 10  ·  WINDOWS 11  ·  LINUX</text>
  </g>

  <!-- Capture timeline: ticks, progress, and a frame marker at each capture -->
  <g transform="translate(96 334)">
    <line x1="0" y1="0" x2="1088" y2="0" stroke="#fff" stroke-opacity=".15" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="672" y2="0" stroke="#67E8F9" stroke-width="4" stroke-linecap="round"/>
    <g fill="#67E8F9">
      <rect x="-9" y="-9" width="18" height="18" rx="4"/><rect x="87" y="-9" width="18" height="18" rx="4"/>
      <rect x="183" y="-9" width="18" height="18" rx="4"/><rect x="279" y="-9" width="18" height="18" rx="4"/>
      <rect x="375" y="-9" width="18" height="18" rx="4"/><rect x="471" y="-9" width="18" height="18" rx="4"/>
      <rect x="567" y="-9" width="18" height="18" rx="4"/><rect x="663" y="-9" width="18" height="18" rx="4"/>
    </g>
    <g fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3">
      <rect x="759" y="-8" width="16" height="16" rx="4"/><rect x="855" y="-8" width="16" height="16" rx="4"/>
      <rect x="951" y="-8" width="16" height="16" rx="4"/><rect x="1047" y="-8" width="16" height="16" rx="4"/>
    </g>
  </g>
</svg>
